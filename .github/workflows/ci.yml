name: Dotfiles CI & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-shell:
    name: lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck on bash scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning
          ignore_paths: '.git'

      - name: Install Fish shell
        run: which fish || (sudo apt-get update -qq && sudo apt-get install -y fish)

      - name: Lint Fish scripts
        run: |
          find . -type f -name "*.fish" -not -path "*/.git/*" -exec fish -n {} +

  test-bootstrap-arch:
    name: test bootstrap in fresh arch container
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Core Utilities & Ansible
        run: |
          pacman -Syu --noconfirm git ansible coreutils

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Ansible Playbook Syntax
        run: |
          ansible-playbook -i ansible/inventory.ini --syntax-check ansible/setup.yml

      - name: Execute Dotfiles Symlink Deployment via Install Script
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Validate Generated Configuration Symlinks
        run: |
          echo "Verifying symlinks..."
          test -L "$HOME/.config/hypr" || exit 1
          test -L "$HOME/.config/kitty" || exit 1
          test -L "$HOME/.config/fish" || exit 1
          echo "All configuration symlinks present and accounted for."

      - name: Test Dotfiles Uninstall Script
        run: |
          chmod +x uninstall.sh
          ./uninstall.sh
          test ! -L "$HOME/.config/hypr" || exit 1
          test ! -L "$HOME/.config/kitty" || exit 1
          test ! -L "$HOME/.config/fish" || exit 1
          echo "All symlinks successfully removed."

  secret-scan:
    name: audit secrets with gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
