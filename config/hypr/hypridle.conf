general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300                                # 5 min
    on-timeout = brightnessctl -s set 10%        # dim screen
    on-resume = brightnessctl -r                # restore brightness
}

listener {
    timeout = 600                                # 10 min
    on-timeout = loginctl lock-session           # lock screen
}

listener {
    timeout = 650                                # 10.5 min
    on-timeout = hyprctl dispatch dpms off       # display sleep
    on-resume = hyprctl dispatch dpms on         # wake display on activity
}
