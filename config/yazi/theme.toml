# By default, theme management is done using a plugin ( yatline.yazi )
# https://github.com/imsi32/yatline.yazi/wiki
# https://github.com/yazi-rs/flavors

#[flavor]
#dark = "catppuccin-macchiato"
#light = "catppuccin-latte"

#[flavor]
#dark = "catppuccin-frappe"

[flavor]
dark = "catppuccin-mocha"

[mgr]
cwd            = { fg = "#b4befe" }
border_style   = { fg = "#cba6f7" }
find_keyword   = { fg = "#f5c2e7", bold = true, italic = true, underline = true }
find_position  = { fg = "#cba6f7", bg = "#313244", bold = true, italic = true }
symlink_target = { fg = "#f5c2e7", italic = true }
marker_marked   = { fg = "#cba6f7", bg = "#cba6f7" }
marker_selected = { fg = "#f5c2e7", bg = "#f5c2e7" }
count_copied   = { fg = "#11111b", bg = "#a6e3a1", bold = true }
count_cut      = { fg = "#11111b", bg = "#f38ba8", bold = true }
count_selected = { fg = "#11111b", bg = "#f5c2e7", bold = true }
syntect_theme  = "/home/asitos/.config/bat/themes/Catppuccin Mocha.tmTheme"

[tabs]
active   = { fg = "#11111b", bg = "#b4befe", bold = true }
inactive = { fg = "#cba6f7", bg = "#313244" }

[mode]
normal_main = { fg = "#11111b", bg = "#b4befe", bold = true }
normal_alt  = { fg = "#b4befe", bg = "#313244" }
select_main = { fg = "#11111b", bg = "#cba6f7", bold = true }
select_alt  = { fg = "#cba6f7", bg = "#313244" }
unset_main  = { fg = "#11111b", bg = "#f5c2e7", bold = true }
unset_alt   = { fg = "#f5c2e7", bg = "#313244" }

[status]
perm_sep        = { fg = "#7f849c" }
perm_type       = { fg = "#b4befe" }
perm_read       = { fg = "#f9e2af" }
perm_write      = { fg = "#f38ba8" }
perm_exec       = { fg = "#a6e3a1" }
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#cba6f7", bg = "#45475a" }
progress_error  = { fg = "#f5c2e7", bg = "#f38ba8" }

[input]
border = { fg = "#cba6f7" }
title  = { fg = "#b4befe" }
value  = { fg = "#cdd6f4" }

[pick]
border = { fg = "#cba6f7" }
active = { fg = "#f5c2e7", bold = true }

[cmp]
border = { fg = "#cba6f7" }

[tasks]
border  = { fg = "#cba6f7" }
hovered = { fg = "#f5c2e7", bold = true }

[which]
mask            = { bg = "#181825" }
cand            = { fg = "#b4befe", bold = true }
rest            = { fg = "#9399b2" }
desc            = { fg = "#f5c2e7" }
separator       = "  "
separator_style = { fg = "#cba6f7" }

[help]
on      = { fg = "#b4befe", bold = true }
run     = { fg = "#f5c2e7" }
hovered = { fg = "#cba6f7", bg = "#313244", bold = true }
footer  = { fg = "#11111b", bg = "#b4befe", bold = true }

[spot]
border  = { fg = "#cba6f7" }
title   = { fg = "#cba6f7" }
tbl_col = { fg = "#b4befe" }

[filetype]
rules = [
	# Images -> Pink
	{ mime = "image/*", fg = "#f5c2e7" },
	# Media (Audio/Video) -> Purple (Mauve)
	{ mime = "{audio,video}/*", fg = "#cba6f7" },
	# Archives -> Flamingo / Warm Pink
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f2cdcd" },
	# Documents -> Rosewater
	{ mime = "application/{pdf,doc,rtf}", fg = "#f5e0dc" },
	# Fallback directories -> Lavender
	{ url = "*/", fg = "#b4befe" },
	# Fallback files -> Mocha Text
	{ url = "*", fg = "#cdd6f4" },
]

[icon]
dirs = [
	{ name = ".config", text = "", fg = "#f5c2e7" },
	{ name = ".git", text = "", fg = "#cba6f7" },
	{ name = ".github", text = "", fg = "#b4befe" },
	{ name = ".npm", text = "", fg = "#f5c2e7" },
	{ name = "Desktop", text = "", fg = "#b4befe" },
	{ name = "Development", text = "", fg = "#cba6f7" },
	{ name = "Documents", text = "", fg = "#f5c2e7" },
	{ name = "Downloads", text = "", fg = "#b4befe" },
	{ name = "Library", text = "", fg = "#cba6f7" },
	{ name = "Movies", text = "", fg = "#cba6f7" },
	{ name = "Music", text = "", fg = "#f5c2e7" },
	{ name = "Pictures", text = "", fg = "#f5c2e7" },
	{ name = "Public", text = "", fg = "#b4befe" },
	{ name = "Videos", text = "", fg = "#cba6f7" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#f38ba8" },
	{ if = "link", text = "", fg = "#b4befe" },
	{ if = "block", text = "", fg = "#f2cdcd" },
	{ if = "char", text = "", fg = "#f2cdcd" },
	{ if = "fifo", text = "", fg = "#f2cdcd" },
	{ if = "sock", text = "", fg = "#f2cdcd" },
	{ if = "sticky", text = "", fg = "#f2cdcd" },
	{ if = "dummy", text = "", fg = "#f38ba8" },

	# Directory icons -> Lavender
	{ if = "dir", text = "", fg = "#b4befe" },
	{ if = "exec", text = "", fg = "#cba6f7" },
	{ if = "!dir", text = "", fg = "#cdd6f4" },
]
